backend:
  name: gestor-gastos-backend
  replicaCount: 1
  image:
    repository: gestor-gastos-backend
    tag: v1
    pullPolicy: Never
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  name: gestor-gastos-frontend
  replicaCount: 1
  image:
    repository: gestor-gastos-frontend
    tag: v1
    pullPolicy: Never
  service:
    type: NodePort
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

database:
  path: /app/data/gastos.db
  persistence:
    enabled: true
    size: 1Gi