apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestor-gastos-backend
  labels:
    app: gestor-gastos-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestor-gastos-backend
  template:
    metadata:
      labels:
        app: gestor-gastos-backend
    spec:
      containers:
      - name: backend
        image: gestor-gastos-backend:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: DB_PATH
          value: /app/data/gastos.db
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /app/data
      securityContext:
        fsGroup: 10001
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: gestor-gastos-data
  strategy:
    type: Recreate
