apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestor-gastos-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestor-gastos-frontend
  template:
    metadata:
      labels:
        app: gestor-gastos-frontend
    spec:
      containers:
        - name: frontend
          image: gestor-gastos-frontend:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
