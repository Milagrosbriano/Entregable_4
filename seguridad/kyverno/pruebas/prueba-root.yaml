apiVersion: v1
kind: Pod
metadata:
  name: prueba-root
  namespace: gestor-gastos
spec:
  containers:
    - name: backend
      image: gestor-gastos-backend:v1
      imagePullPolicy: Never
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        allowPrivilegeEscalation: false
