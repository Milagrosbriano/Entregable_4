apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: impedir-escalada-privilegios
spec:
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gestor-gastos
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validationActions: [Deny]
  validations:
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)
      message: "Cada contenedor debe declarar allowPrivilegeEscalation false."