apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: prohibir-latest
spec:
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gestor-gastos
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validationActions: [Deny]
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))
      message: "La imagen debe tener una etiqueta explicita distinta de latest."