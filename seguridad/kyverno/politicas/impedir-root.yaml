apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: impedir-root
spec:
  background: false
  rules:
    - name: validar-usuario
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - gestor-gastos
      validate:
        failureAction: Enforce
        message: "Cada contenedor debe declarar runAsNonRoot true y runAsUser mayor a cero."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
                  runAsUser: ">0"
